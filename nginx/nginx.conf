server {
  listen 8080;
  server_name frontend;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  # The page itself must always be re-checked: a stale index.html points at old, deleted bundles, and
  # phones kept running an old version for hours after a deploy. The bundles are hashed and cacheable.
  location = /index.html {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  }
  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html =404;
  }
}
